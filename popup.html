<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #4CAF50;
        }
        
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        
        .description {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
        }
        
        .status {
            text-align: center;
            font-size: 12px;
            color: #4CAF50;
            margin-top: 10px;
        }
        
        .slider-container {
            margin-bottom: 15px;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .slider-value {
            color: #666;
            font-size: 12px;
        }
        
        .range-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }
        
        .range-slider::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4CAF50;
            cursor: pointer;
        }
        
        .range-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4CAF50;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>Auto Copy Selection</h3>
    </div>
    
    <div class="toggle-container">
        <span>Enable Auto Copy</span>
        <label class="switch">
            <input type="checkbox" id="enableToggle">
            <span class="slider"></span>
        </label>
    </div>
    
    <div class="toggle-container">
        <span>Hold & Release to Paste</span>
        <label class="switch">
            <input type="checkbox" id="pasteToggle">
            <span class="slider"></span>
        </label>
    </div>
    
    <div class="slider-container">
        <div class="slider-label">
            <span>Paste Delay</span>
            <span class="slider-value" id="delayValue">450ms</span>
        </div>
        <input type="range" id="delaySlider" class="range-slider" min="200" max="1000" step="50" value="450">
    </div>
    
    <div class="description">
        Auto copy: Selected text is automatically copied to your clipboard.<br><br>
        Hold & release: Click and hold on any input field to paste clipboard contents. Adjust the paste delay above to customize the hold duration.
    </div>
    
    <div class="status" id="status"></div>
    
    <script src="popup.js"></script>
</body>
</html>
